<!--
Index page by Aristeas, stole the rough theme from the br calculator
-->

<!doctype HTML>
<head>
    <title>SETB Index</title>


    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">
    <link rel="manifest" href="./icons/site.webmanifest">

    <!--discord embed-->
    <meta content='SETB Index' property='og:title' />
    <meta content='Space Engineers Tank Battles Quick-Links' property='og:description'/>
    <meta content='https://setankbattles.github.io/' property='og:url' />
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        :root {
            --bg:#101820;
            --panel:#1b2732;
            --panel2:#243442;
            --text:#eef3f6;
            --muted:#aebdc8;
            --accent:#e0ad55;
            --line:#3b4c59;
        }
        html:before{
            content:"";
            width: 100%;
            height: 100%;
            position: fixed;
            background: linear-gradient(145deg,#101820,#172631);
            z-index: -1;
        }
        .canvas {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            color: var(--text);
            font: 16px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
            text-align: center;
        }
        .surface {
            border:1px solid var(--line);
            border-radius:14px;
            padding: 18px;
            margin: 18px;
            max-width: 90%;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            flex-grow: 1;

            gap: 10px;
        }
        .section {
            background: var(--panel);
            border:1px solid var(--line);
            border-radius:14px;
            padding:18px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            gap: 5px
        }
        .elevated {
            color: var(--accent);
            font-size:.78rem;
            font-weight:800;
            letter-spacing:.16em;
            text-transform:uppercase;
        }
        .text {
            color: var(--text);
        }
        .muted {
            color: var(--muted);
        }

        a:link {
            text-decoration: none;
        }
        a:visited {
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        a:active {
            text-decoration: underline;
        }


        header {
            margin-bottom: 20px;
        }
        header > p {
            margin:0;
            color:var(--muted);
        }
        h1 {
            margin:5px 0 7px;
            font-size:clamp(1.8rem,5vw,2.6rem);
            line-height:1.1;
        }
        h2 {
            font-size:1rem;
            text-transform:uppercase;
            letter-spacing:.08em;
            color:var(--accent);
        }
        div.content {
            display: inherit;
            flex-direction: inherit;
            justify-content: inherit;
            align-items: inherit;
            height: 100%;
            max-width: 90%;

            gap: inherit;
        }
        div.content > * {
            width: 100%;
        }
        h2.header {
            margin:0 0 15px;
        }
        .discord {
            min-height: 250px;
            pointer-events: none;
        }
    </style>
</head>
<body class="canvas">
    <main class="surface">
        <header>
            <h1>Space Engineers Tank Battles</h1>
            <p>Quick Links</p>
        </header>
        <div class="content">
            <a href="https://docs.google.com/document/d/1GnncHMj07MQo3FLjHgu3fUXcUYnoDF1HtqbHnhooHXk/edit?tab=t.0" class="section">
                <h2>Event Rules</h2>
            </a>
            <a href="./brcalc.html" class="section">
                <h2>Battle Rating Calculator</h2>
            </a>
            <a href="https://github.com/setankbattles" class="section">
                <h2>GitHub</h2>
            </a>
            <a href="https://trello.com/b/uYzk3vIl/setb-to-do-list" class="section">
                <h2>Trello</h2>
            </a>
            <a href="https://discord.gg/FmZpbPJuY6" class="section">
                <h2 class="header">Join the Discord</h2>
                <iframe class="discord" src="https://discord.com/widget?id=379032232037318657&theme=dark" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
            </a>
        </div>
    </main>
</body>
